[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-channel-mcp"
version = "0.1.0"
description = "Persistent local conversations between agent sessions over MCP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
agent-channel-mcp = "agent_channel_mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
